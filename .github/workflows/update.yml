name: Auto Daily Market Updater

on:
  schedule:
    - cron: '17 1 * * *'  # Runs at 1:17 AM UTC (6:47 AM IST) to avoid top-of-the-hour server queues
  workflow_dispatch:

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas pytz

      - name: Execute Daily Price Sync
        run: |
          python update_data.py

      - name: Auto-Commit & Deploy Updated Prices
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market prices [skip ci]" && git push)
